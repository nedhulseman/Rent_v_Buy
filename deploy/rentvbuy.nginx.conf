# Install at /etc/nginx/sites-available/rentvbuy, symlink into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo certbot --nginx -d rentvbuy.example.com   (edit server_name first)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /static/ {
        alias /home/ubuntu/rent_v_buy/static/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # The first ZIP lookup downloads ~124 MB from Zillow and can take ~10s.
        proxy_read_timeout 120s;
    }
}
