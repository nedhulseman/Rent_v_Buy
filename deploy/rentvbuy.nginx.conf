# Install at /etc/nginx/sites-available/rentvbuy, symlink into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo certbot --nginx -d rentvbuy.example.com   (edit server_name first)
# NOTE: if TackTracker is on this same box it already owns `default_server` on :80 and
# gunicorn :8000. This site therefore uses :8001 and needs a REAL server_name — two
# default_servers on one port is an nginx config error. Point a DNS A record at the box
# (e.g. rentvbuy.tacktrackersailing.com) and put it below.
server {
    listen 80;
    listen [::]:80;
    server_name rentvbuy.example.com;   # <-- change me

    location /static/ {
        alias /home/ubuntu/rent_v_buy/static/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # The first ZIP lookup downloads ~124 MB from Zillow and can take ~10s.
        proxy_read_timeout 120s;
    }
}
