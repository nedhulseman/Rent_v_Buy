# Amazon Linux 2023: drop this at /etc/nginx/conf.d/rentvbuy.conf (AL has no
# sites-available/sites-enabled — nginx.conf already includes /etc/nginx/conf.d/*.conf), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: sudo dnf install -y certbot python3-certbot-nginx
#      sudo certbot --nginx -d yourdomain
#
# `server_name _` claims every hostname, which is fine when this is the only site on the box.
# If you ever put another app here, give each a real server_name instead.
# `default_server` is deliberate: Amazon Linux's stock /etc/nginx/nginx.conf ships its own
# `server_name _` block (the welcome page), so without this nginx warns about a conflicting
# server name and may serve that one instead of the app. Marking this block as the default for
# the socket wins regardless of parse order.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /static/ {
        alias /home/ec2-user/rent_v_buy/static/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # The first ZIP lookup pulls ~124 MB from Zillow and can take ~10s.
        proxy_read_timeout 120s;
    }
}
